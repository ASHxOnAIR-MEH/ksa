<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saudi Arabia gym membership planner</title>
<style>*{box-sizing:border-box}body{margin:0;background:#142724;color:#fbf7ea;font:18px/1.5 system-ui}main{max-width:640px;margin:7vh auto;padding:24px}h1{font-size:clamp(36px,8vw,66px);line-height:1;letter-spacing:-.055em}form{display:grid;gap:14px}label{display:grid;gap:4px}input,button{font:inherit;padding:12px;border-radius:6px;border:1px solid #899}button{background:#dcff8a;color:#18241a;font-weight:bold}output{display:block;margin-top:24px;border-top:1px solid #82918a;padding-top:16px}</style>
<main><p>Saudi Arabia / Gym membership</p><h1>What will each visit cost?</h1><form id="plan"><label>Membership price (SAR)<input name="price" type="number" min="0" step=".01" required></label><label>Joining fee (SAR)<input name="fee" type="number" min="0" step=".01" value="0" required></label><label>Membership length in months<input name="months" type="number" min="1" max="120" value="12" required></label><label>Expected visits per month<input name="visits" type="number" min="1" max="100" value="12" required></label><button>Calculate cost</button></form><output id="result" aria-live="polite"></output></main>
<script src="planner.js"></script></html>
